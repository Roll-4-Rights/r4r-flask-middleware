name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app db.py app.py wsgi.py

      - name: Ruff format
        run: ruff format --check app db.py app.py wsgi.py

      - name: Syntax check
        run: python -m compileall -q app db.py app.py wsgi.py
